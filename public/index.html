<!DOCTYPE html>
<html lang="it">
<head>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #0B0E14;
    --card: #131826;
    --card-hi: #1B2233;
    --violet: #A855F7;
    --cyan: #22D3EE;
    --gold: #F5C451;
    --text: #E8ECF1;
    --muted: #7C8496;
  }

  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    margin: 0;
    height: 100%;
    overscroll-behavior: none;
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  #root {
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    background:
      radial-gradient(circle at 20% 0%, rgba(168,85,247,0.12), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(34,211,238,0.10), transparent 40%),
      var(--bg);
  }

  .font-display { font-family: 'Space Grotesk', sans-serif; }

  .scroll-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  /* ---------- FROG + COIN TOSS ANIMATION ---------- */

  .frog-stage {
    position: relative;
    width: 220px;
    height: 220px;
    margin: 0 auto;
  }

  .frog-shadow {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 18px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.5), transparent 70%);
    border-radius: 50%;
    animation: shadowPulse 2.4s ease-in-out infinite;
  }

  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
    30% { transform: translateX(-50%) scale(0.85); opacity: 0.4; }
  }

  .frog-body {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    animation: frogBob 2.4s ease-in-out infinite;
  }

  @keyframes frogBob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    30% { transform: translateX(-50%) translateY(-10px); }
  }

  .frog-arm {
    transform-origin: 78px 92px;
    animation: armToss 2.4s ease-in-out infinite;
  }

  @keyframes armToss {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(-55deg); }
    30%  { transform: rotate(10deg); }
    100% { transform: rotate(0deg); }
  }

  .coin-toss {
    position: absolute;
    left: 50%;
    bottom: 96px;
    width: 34px;
    height: 34px;
    margin-left: 18px;
    animation: coinArc 2.4s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(245,196,81,0.6));
  }

  @keyframes coinArc {
    0%   { transform: translate(0px, 0px) scale(0.8) rotateY(0deg); opacity: 0; }
    16%  { opacity: 1; }
    30%  { transform: translate(10px, -95px) scale(1) rotateY(540deg); }
    48%  { transform: translate(20px, -20px) scale(1) rotateY(1080deg); }
    58%  { transform: translate(22px, 4px) scale(0.9) rotateY(1260deg); opacity: 1; }
    64%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .coin-face {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), #C9922E);
    border: 2px solid #FFE7A8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #3A2A05;
  }

  .energy-bar-track {
    height: 10px;
    border-radius: 999px;
    background: var(--card-hi);
    overflow: hidden;
  }

  .energy-bar-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    transition: width 0.2s linear;
  }

  .tap-coin-btn {
    width: 168px;
    height: 168px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFE7A8, var(--gold) 55%, #B8862A 100%);
    border: 4px solid rgba(245,196,81,0.35);
    box-shadow: 0 0 40px rgba(245,196,81,0.25), inset 0 -8px 16px rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 15px; color: #3A2A05;
    user-select: none;
    transition: transform 0.08s ease;
  }
  .tap-coin-btn:active { transform: scale(0.94); }

  .tab-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; color: var(--muted);
    padding: 6px 0;
    transition: color 0.15s ease;
  }
  .tab-btn.active { color: var(--text); }
  .tab-icon { font-size: 20px; }

  .card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
  }

  ::-webkit-scrollbar { display: none; }
</style>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const cfg = APP_CONFIG;

// ---------------------------------------------------------------
// Utility: formattazione numeri con animazione fluida
// ---------------------------------------------------------------
function useAnimatedNumber(value) {
  const [display, setDisplay] = useState(value);
  const frame = useRef(null);
  useEffect(() => {
    const start = display;
    const diff = value - start;
    if (diff === 0) return;
    const duration = 400;
    const t0 = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - t0) / duration);
      setDisplay(Math.round(start + diff * p));
      if (p < 1) frame.current = requestAnimationFrame(tick);
    }
    frame.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frame.current);
    // eslint-disable-next-line
  }, [value]);
  return display;
}

// ---------------------------------------------------------------
// Mascotte: rana che lancia una moneta (loop CSS, nessun JS pesante)
// ---------------------------------------------------------------
function FrogMascot() {
  return (
    <div className="frog-stage">
      <div className="frog-shadow" />
      <div className="coin-toss">
        <div className="coin-face">🪙</div>
      </div>
      <div className="frog-body">
        <svg width="140" height="120" viewBox="0 0 140 120">
          {/* corpo */}
          <ellipse cx="70" cy="78" rx="46" ry="34" fill="#3FB65D" />
          {/* pancia */}
          <ellipse cx="70" cy="88" rx="30" ry="20" fill="#CFF2CE" />
          {/* occhio sx */}
          <circle cx="48" cy="42" r="16" fill="#3FB65D" />
          <circle cx="48" cy="42" r="9" fill="#0B0E14" />
          <circle cx="51" cy="39" r="2.5" fill="#fff" />
          {/* occhio dx */}
          <circle cx="88" cy="42" r="16" fill="#3FB65D" />
          <circle cx="88" cy="42" r="9" fill="#0B0E14" />
          <circle cx="91" cy="39" r="2.5" fill="#fff" />
          {/* bocca */}
          <path d="M55 62 Q70 72 85 62" stroke="#0B0E14" strokeWidth="3" fill="none" strokeLinecap="round" />
          {/* zampa/braccio che lancia */}
          <g className="frog-arm">
            <ellipse cx="100" cy="88" rx="10" ry="18" fill="#3FB65D" transform="rotate(20 100 88)" />
          </g>
          {/* zampa ferma */}
          <ellipse cx="38" cy="92" rx="10" ry="16" fill="#2FA04C" transform="rotate(-15 38 92)" />
        </svg>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------
// Splash Screen
// ---------------------------------------------------------------
function SplashScreen({ onDone }) {
  const [ready, setReady] = useState(false);

  useEffect(() => {
    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
    } catch (e) {
      // Ambiente di test fuori da Telegram: si ignora l'errore
    }
    const t = setTimeout(() => setReady(true), 1600);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    if (ready) {
      const t = setTimeout(onDone, 300);
      return () => clearTimeout(t);
    }
  }, [ready]);

  return (
    <div className="flex-1 flex flex-col items-center justify-center h-full gap-6">
      <FrogMascot />
      <div className="text-center">
        <div className="font-display text-2xl font-bold tracking-tight">{cfg.copy.appName}</div>
        <div className="text-sm text-[var(--muted)] mt-1">{cfg.copy.tagline}</div>
      </div>
      <div className="w-40 h-1.5 rounded-full bg-[var(--card-hi)] overflow-hidden">
        <div className="h-full bg-gradient-to-r from-[var(--cyan)] to-[var(--violet)]"
             style={{ width: ready ? '100%' : '70%', transition: 'width 1.4s ease' }} />
      </div>
    </div>
  );
}

// ---------------------------------------------------------------
// Home: farming passivo + tap-to-earn
// ---------------------------------------------------------------
function HomeScreen({ state, setState }) {
  const displayPoints = useAnimatedNumber(state.points);
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    const i = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(i);
  }, []);

  // Rigenerazione energia
  useEffect(() => {
    const i = setInterval(() => {
      setState(s => ({
        ...s,
        energy: Math.min(cfg.tap.maxEnergy, s.energy + cfg.tap.energyRegenPerSecond)
      }));
    }, 1000);
    return () => clearInterval(i);
  }, []);

  const farmEndsAt = state.farmStartedAt
    ? state.farmStartedAt + cfg.farming.durationHours * 3600 * 1000
    : null;
  const farmReady = farmEndsAt && now >= farmEndsAt;
  const farmProgress = state.farmStartedAt
    ? Math.min(1, (now - state.farmStartedAt) / (cfg.farming.durationHours * 3600 * 1000))
    : 0;

  function handleFarmButton() {
    if (!state.farmStartedAt) {
      setState(s => ({ ...s, farmStartedAt: Date.now() }));
    } else if (farmReady) {
      setState(s => ({
        ...s,
        points: s.points + cfg.farming.rewardPerCycle,
        farmStartedAt: null
      }));
    }
  }

  function handleTap() {
    setState(s => {
      if (s.energy < cfg.tap.energyCostPerTap) return s;
      return {
        ...s,
        points: s.points + cfg.tap.pointsPerTap,
        energy: s.energy - cfg.tap.energyCostPerTap
      };
    });
  }

  function fmtTime(ms) {
    if (ms <= 0) return "00:00:00";
    const s = Math.floor(ms / 1000);
    const h = String(Math.floor(s / 3600)).padStart(2, '0');
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    const sec = String(s % 60).padStart(2, '0');
    return `${h}:${m}:${sec}`;
  }

  return (
    <div className="px-5 pt-6 pb-4 flex flex-col gap-6">
      <FrogMascot />

      <div className="text-center">
        <div className="text-xs text-[var(--muted)] mb-1">Saldo totale</div>
        <div className="font-display text-4xl font-bold">
          {displayPoints.toLocaleString('it-IT')} <span className="text-[var(--gold)]">{cfg.tokenName}</span>
        </div>
      </div>

      {/* Farming passivo */}
      <div className="card p-4">
        <div className="flex justify-between items-center mb-3">
          <span className="text-sm font-medium">Mining passivo</span>
          <span className="text-xs text-[var(--muted)]">+{cfg.farming.rewardPerCycle} / {cfg.farming.durationHours}h</span>
        </div>
        <div className="energy-bar-track mb-3">
          <div className="energy-bar-fill" style={{ width: `${farmProgress * 100}%` }} />
        </div>
        <div className="flex justify-between items-center">
          <span className="text-sm text-[var(--muted)]">
            {state.farmStartedAt
              ? (farmReady ? "Pronto per il claim!" : fmtTime(farmEndsAt - now))
              : "Non attivo"}
          </span>
          <button
            onClick={handleFarmButton}
            className="px-5 py-2 rounded-full font-display font-semibold text-sm"
            style={{
              background: farmReady
                ? 'linear-gradient(90deg, var(--cyan), var(--violet))'
                : 'var(--card-hi)',
              color: farmReady ? '#0B0E14' : 'var(--text)'
            }}
          >
            {!state.farmStartedAt ? cfg.copy.claimButtonIdle : (farmReady ? cfg.copy.claimButtonReady : "In corso…")}
          </button>
        </div>
      </div>

      {/* Tap to earn */}
      <div className="card p-5 flex flex-col items-center gap-4">
        <div className="w-full flex justify-between items-center text-xs text-[var(--muted)]">
          <span>Energia</span>
          <span>{state.energy} / {cfg.tap.maxEnergy}</span>
        </div>
        <div className="energy-bar-track w-full">
          <div className="energy-bar-fill" style={{ width: `${(state.energy / cfg.tap.maxEnergy) * 100}%` }} />
        </div>
        <button className="tap-coin-btn" onClick={handleTap}>
          TAP 🐸
        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------
// Tasks
// ---------------------------------------------------------------
function TasksScreen({ state, setState }) {
  const [pending, setPending] = useState({});

  function startTask(task) {
    window.open(task.url, '_blank');
    setPending(p => ({ ...p, [task.id]: 'verifying' }));
    setTimeout(() => {
      setPending(p => ({ ...p, [task.id]: 'ready' }));
    }, task.verifySeconds * 1000);
  }

  function claimTask(task) {
    setState(s => ({
      ...s,
      points: s.points + task.reward,
      completedTasks: [...s.completedTasks, task.id]
    }));
    setPending(p => ({ ...p, [task.id]: 'done' }));
  }

  const categories = [...new Set(cfg.tasks.map(t => t.category))];

  return (
    <div className="px-5 pt-6 pb-4 flex flex-col gap-6">
      <div className="font-display text-xl font-bold">Missioni</div>
      {categories.map(cat => (
        <div key={cat} className="flex flex-col gap-3">
          <div className="text-xs uppercase tracking-wide text-[var(--muted)]">{cat}</div>
          {cfg.tasks.filter(t => t.category === cat).map(task => {
            const status = state.completedTasks.includes(task.id) ? 'done' : (pending[task.id] || 'idle');
            return (
              <div key={task.id} className="card p-4 flex items-center gap-3">
                <div className="text-2xl">{task.icon}</div>
                <div className="flex-1">
                  <div className="text-sm font-medium">{task.title}</div>
                  <div className="text-xs text-[var(--gold)]">+{task.reward} {cfg.tokenName}</div>
                </div>
                {status === 'done' && (
                  <span className="text-xs text-[var(--cyan)] font-medium">Fatto ✓</span>
                )}
                {status === 'idle' && (
                  <button onClick={() => startTask(task)}
                    className="px-4 py-1.5 rounded-full text-xs font-semibold bg-[var(--card-hi)]">
                    Vai
                  </button>
                )}
                {status === 'verifying' && (
                  <span className="text-xs text-[var(--muted)]">Verifica…</span>
                )}
                {status === 'ready' && (
                  <button onClick={() => claimTask(task)}
                    className="px-4 py-1.5 rounded-full text-xs font-semibold"
                    style={{ background: 'linear-gradient(90deg, var(--cyan), var(--violet))', color: '#0B0E14' }}>
                    Claim
                  </button>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ---------------------------------------------------------------
// Referral / Frenz
// ---------------------------------------------------------------
function FrenzScreen({ state }) {
  const userId = (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || "demo";
  const inviteLink = `https://t.me/${cfg.botUsername}/${cfg.miniAppShortName}?startapp=${userId}`;

  function shareInvite() {
    const tg = window.Telegram && window.Telegram.WebApp;
    const text = encodeURIComponent(cfg.referral.inviteMessage);
    const url = `https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${text}`;
    if (tg && tg.openTelegramLink) {
      tg.openTelegramLink(url);
    } else {
      window.open(url, '_blank');
    }
  }

  return (
    <div className="px-5 pt-6 pb-4 flex flex-col gap-6">
      <div className="font-display text-xl font-bold">Invita amici</div>

      <div className="card p-5 text-center flex flex-col gap-3">
        <div className="text-sm text-[var(--muted)]">
          Guadagna <span className="text-[var(--gold)] font-semibold">+{cfg.referral.bonusPercent}%</span> dei punti dei tuoi amici, per sempre.
        </div>
        <button onClick={shareInvite}
          className="mt-2 py-3 rounded-full font-display font-semibold text-sm"
          style={{ background: 'linear-gradient(90deg, var(--cyan), var(--violet))', color: '#0B0E14' }}>
          Invita un amico
        </button>
      </div>

      <div className="flex flex-col gap-2">
        <div className="text-xs uppercase tracking-wide text-[var(--muted)]">
          I tuoi amici ({state.referrals.length})
        </div>
        {state.referrals.length === 0 && (
          <div className="card p-4 text-sm text-[var(--muted)] text-center">
            Nessun amico invitato ancora.
          </div>
        )}
        {state.referrals.map((r, i) => (
          <div key={i} className="card p-3 flex justify-between items-center text-sm">
            <span>{r.name}</span>
            <span className="text-[var(--gold)]">+{r.earned} {cfg.tokenName}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------
// Wallet (TON Connect — solo collegamento, nessun trasferimento)
// ---------------------------------------------------------------

  function connectWallet() {
    // Placeholder di collegamento: qui andrà integrato il vero
    // TonConnect SDK (@tonconnect/ui) quando pubblichi davvero l'app.
    const fakeAddress = "EQAbc123...xyz9";

  return (
    <div className="px-5 pt-6 pb-4 flex flex-col gap-6">

        <div className="text-3xl">💎</div>
        {state.wallet ? (
          <>
            <div className="text-sm text-[var(--muted)]">Wallet collegato</div>
            <div className="font-mono text-sm">{state.wallet}</div>
            <span className="text-xs px-3 py-1 rounded-full" style={{ background: 'var(--card-hi)', color: 'var(--gold)' }}>
              🏅 Badge sbloccato
            </span>
          </>
        ) : (
          <>
            <div className="text-sm text-[var(--muted)]">
              Collega il tuo wallet TON per sbloccare un badge esclusivo.
            </div>
            <button onClick={connectWallet}
              className="px-6 py-3 rounded-full font-display font-semibold text-sm"
              style={{ background: 'linear-gradient(90deg, var(--cyan), var(--violet))', color: '#0B0E14' }}>
              TON Connect
            </button>
          </>
        )}
      </div>
    </div>

}

// ---------------------------------------------------------------
// Daily Check-in
// ---------------------------------------------------------------
function DailyCheckinModal({ state, setState, onClose }) {
  const dayIndex = Math.min(state.streak, cfg.dailyCheckin.rewards.length - 1);
  const reward = cfg.dailyCheckin.rewards[dayIndex];
  const isMystery = reward === 'mystery';

  function claim() {
    let gained = reward;
    if (isMystery) {
      const { mysteryBoxMin, mysteryBoxMax } = cfg.dailyCheckin;
      gained = Math.floor(mysteryBoxMin + Math.random() * (mysteryBoxMax - mysteryBoxMin));
    }
    setState(s => ({
      ...s,
      points: s.points + gained,
      streak: (s.streak + 1) % cfg.dailyCheckin.rewards.length,
      lastCheckin: Date.now()
    }));
    onClose();
  }

  return (
    <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/70 px-6">
      <div className="card p-6 w-full flex flex-col items-center gap-4 text-center">
        <div className="text-4xl">{isMystery ? "🎁" : "🐸"}</div>
        <div className="font-display text-lg font-bold">
          Giorno {dayIndex + 1} di 7
        </div>
        <div className="text-sm text-[var(--muted)]">
          {isMystery ? "Mystery Box! Apri per scoprire il premio." : `Ricevi ${reward} ${cfg.tokenName} per essere tornato oggi.`}
        </div>
        <button onClick={claim}
          className="w-full py-3 rounded-full font-display font-semibold text-sm"
          style={{ background: 'linear-gradient(90deg, var(--gold), var(--cyan))', color: '#0B0E14' }}>
          {isMystery ? "Apri" : "Ritira"}
        </button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------
// App principale
// ---------------------------------------------------------------
function App() {
  const [booted, setBooted] = useState(false);
  const [tab, setTab] = useState('home');
  const [state, setState] = useState({
    points: 0,
    energy: cfg.tap.maxEnergy,
    farmStartedAt: null,
    completedTasks: [],
    referrals: [],
    wallet: null,
    walletBadgeClaimed: false,
    streak: 0,
    lastCheckin: null,
  });
  const [showCheckin, setShowCheckin] = useState(false);

  useEffect(() => {
    if (!booted) return;
    const last = state.lastCheckin;
    const oneDay = 24 * 3600 * 1000;
    if (!last || Date.now() - last > oneDay) {
      setShowCheckin(true);
    }
    // eslint-disable-next-line
  }, [booted]);

  if (!booted) {
    return <SplashScreen onDone={() => setBooted(true)} />;
  }

  const tabs = [
    { id: 'home', icon: '🐸', label: 'Home' },
    { id: 'tasks', icon: '📋', label: 'Task' },
    { id: 'frenz', icon: '👥', label: 'Frenz' },
    { id: 'wallet', icon: '💎', label: 'Wallet' },
  ];

  return (
    <div className="flex flex-col h-full relative">
      <div className="scroll-area">
        {tab === 'home' && <HomeScreen state={state} setState={setState} />}
        {tab === 'tasks' && <TasksScreen state={state} setState={setState} />}
        {tab === 'frenz' && <FrenzScreen state={state} />}
        {tab === 'wallet' && <WalletScreen state={state} setState={setState} />}
      </div>

      <div className="grid grid-cols-4 border-t border-white/5 bg-[var(--card)] pb-[env(safe-area-inset-bottom)]">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={`tab-btn ${tab === t.id ? 'active' : ''}`}>
            <span className="tab-icon">{t.icon}</span>
            <span>{t.label}</span>
          </button>
        ))}
      </div>

      {showCheckin && (
        <DailyCheckinModal state={state} setState={setState} onClose={() => setShowCheckin(false)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
